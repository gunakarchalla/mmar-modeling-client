<div style="height: 80%; overflow-y: auto;" class="hidescroll">
    <h5>Simulation</h5>

    <div if.bind="loading">Loading…</div>
    <div if.bind="!loading && errorMessage">${errorMessage}</div>

    <div if.bind="!loading && !errorMessage && !isRoboticSystemSceneType">
        <div>This simulation panel is only available for the Robotic System scene type.</div>
    </div>

    <div if.bind="!loading && !errorMessage && isRoboticSystemSceneType">
        <div if.bind="!jointControls.length">No Joint instances found in the active scene.</div>

        <div repeat.for="ctrl of jointControls" style="margin: 12px 0;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <div>${ctrl.displayName}</div>
                <div>Value: ${ctrl.value}</div>
            </div>

            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="min-width: 72px;">Min: ${ctrl.lower}</div>

                <mdc-slider
                    style="flex: 1;"
                    min.bind="ctrl.lower"
                    max.bind="ctrl.upper"
                    step.bind="ctrl.step"
                    value.bind="ctrl.value"
                    disabled.bind="ctrl.disabled"
                    input.trigger="onJointValueChanged(ctrl)"
                    change.trigger="onJointValueChanged(ctrl)">
                </mdc-slider>

                <div style="min-width: 72px;">Max: ${ctrl.upper}</div>
            </div>
        </div>
    </div>
</div>
